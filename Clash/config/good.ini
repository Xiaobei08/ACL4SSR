[Profile]

[General]
mixed-port=7890
allow-lan=true
mode=rule
log-level=warning
external-controller=0.0.0.0:9090

[Clash]
dns:
  enable: true
  listen: 0.0.0.0:1053
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*.lan"
    - "*.localhost"
    - "+.local"
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query

[Proxy]
; 无内置节点，全部来自订阅链接

[Proxy Group]
; ==================== 主入口 ====================
custom_proxy_group=🚀 节点选择`select`[]♻️ 自动选择`[]⚖️ 负载均衡`[]🔯 故障转移`[]👋 手动切换`[]🌍 国家选择`[]☁️ Cloudflare`[]🎮 游戏平台`[]DIRECT

; ==================== 基础策略 ====================
custom_proxy_group=♻️ 自动选择`url-test`.*`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=⚖️ 负载均衡`load-balance`.*`consistent-hashing`
custom_proxy_group=🔯 故障转移`fallback`.*`http://www.gstatic.com/generate_204`300
custom_proxy_group=👋 手动切换`select`.*

; ==================== 国家选择（35个） ====================
