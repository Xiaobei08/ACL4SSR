[Profile]

[General]
mixed-port=7890
allow-lan=true
mode=rule
log-level=warning
external-controller=0.0.0.0:9090

[Clash]
dns:
  enable: true
  listen: 0.0.0.0:1053
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*.lan"
    - "*.localhost"
    - "+.local"
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query

[Proxy]
; 无内置节点，全部来自订阅链接

[custom]
; ==================== 代理组定义 ====================

; ---------- 主入口 ----------
custom_proxy_group=🚀 节点选择`select`[]♻️ 自动选择`[]⚖️ 负载均衡`[]🔯 故障转移`[]👋 手动切换`[]🌍 国家选择`[]☁️ Cloudflare`[]🎮 游戏平台`[]🛑 广告拦截`[]🐟 漏网之鱼`[]DIRECT

; ---------- 基础策略 ----------
custom_proxy_group=♻️ 自动选择`url-test`.*`http://www.gstatic.com/generate_204`300,,50
custom_proxy_group=⚖️ 负载均衡`load-balance`.*`consistent-hashing`
custom_proxy_group=🔯 故障转移`fallback`.*`http://www.gstatic.com/generate_204`300
custom_proxy_group=👋 手动切换`select`.*

; ---------- 国家选择（35个） ----------
custom_proxy_group=🌍 国家选择`select`[]🇭🇰 香港节点`[]🇺🇸 美国节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`[]🇹🇼 台湾节点`[]🇰🇷 韩国节点`[]🇬🇧 英国节点`[]🇩🇪 德国节点`[]🇨🇦 加拿大节点`[]🇫🇷 法国节点`[]🇦🇺 澳大利亚节点`[]🇮🇳 印度节点`[]🇻🇳 越南节点`[]🇲🇾 马来西亚节点`[]🇷🇺 俄罗斯节点`[]🇧🇷 巴西节点`[]🇹🇷 土耳其节点`[]🇳🇱 荷兰节点`[]🇸🇪 瑞典节点`[]🇨🇭 瑞士节点`[]🇮🇹 意大利节点`[]🇪🇸 西班牙节点`[]🇮🇩 印尼节点`[]🇹🇭 泰国节点`[]🇵🇭 菲律宾节点`[]🇳🇿 新西兰节点`[]🇿🇦 南非节点`[]🇲🇽 墨西哥节点`[]🇨🇱 智利节点`[]🇨🇴 哥伦比亚节点`[]🇵🇱 波兰节点`[]🇳🇴 挪威节点`[]🇵🇹 葡萄牙节点`[]🇬🇷 希腊节点`[]🇦🇪 阿联酋节点`[]🌍 其他节点

; ---------- Cloudflare ----------
