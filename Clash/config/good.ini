custom_proxy_group=☁️ Cloudflare`select`[]⚡️ Cloudflare - 自动测速`[]🇺🇸 美国节点`[]🇯🇵 日本节点`[]🇸🇬 新加坡节点`[]♻️ 自动选择`[]👋 手动切换`[]DIRECT

